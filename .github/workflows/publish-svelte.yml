name: Publish Svelte

on:
  push:
    branches: 
      - main
    paths:
      - 'packages/svelte/**'
  workflow_dispatch:

concurrency: publish-svelte-${{ github.ref }}

jobs:
  release-svelte:
    name: Release Svelte
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm i && npm ci --include=optional

      - name: Build Svelte
        run: npm run build:svelte

      - name: Create Release Pull Request or Publish Svelte
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          title: "Version Packages (Svelte)"
          createGithubReleases: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
