name: CI Core

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/core/**'

jobs:
  check-core:
    name: Check Changeset & Build Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Install Dependencies
        run: npm i && npm ci --include=optional

      - name: Verify Changeset Exists
        run: npx changeset status --since=origin/main

      - name: Build Core
        run: npm run build:core
