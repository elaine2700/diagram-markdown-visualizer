name: Publish Core

on:
  push:
    branches: 
      - main
    paths:
      - 'packages/core/**'
  workflow_dispatch:

concurrency: publish-core-${{ github.ref }}

jobs:
  release-core:
    name: Release Core
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm i && npm ci --include=optional

      - name: Build Core
        run: npm run build:core

      - name: Create Release Pull Request or Publish Core
        uses: changesets/action@v2
        with:
          publish-script: npm run release
          pr-title: "Version Packages (Svelte)"
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
