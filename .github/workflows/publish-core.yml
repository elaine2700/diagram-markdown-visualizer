name: Publish Core

on:
  push:
    branches: 
      - main
    paths:
      - 'packages/core/**'
  workflow_dispatch:

concurrency: publish-core-${{ github.ref }}

jobs:
  release-core:
    name: Release Core
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm i && npm ci --include=optional

      - name: Build Core
        run: npm run build:core

      - name: Create Release Pull Request or Publish Core
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          title: "Version Packages (Core)"
          createGithubReleases: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
